<style>

<script>
const C='#22d3ee',G='#34d399',X='#fb7185',A='#fbbf24',V='#a78bfa',P='#f472b6',D='#5b6785';

const PK='#f472b6',M='#8e9bb8';

const nd=(id,x,y,i,l,s,c)=>({id,x,y,i,l,s,c});
const apps=[['G','🎮','Game','Game Server',PK,5000,84],['V','🎥','Video','Video Server',C,5001,184],['C','💬','Chat','Chat Server',G,5002,284],['W','🌐','Browser','Web Server',A,5003,384]];

const FL={};apps.forEach(([k,i,n,sn,c,port])=>{FL['a'+k]={path:['a'+k,'TA','NET','TB','b'+k],label:lbl[k]+' → '+port,color:c,title:n+' stream',text:'The '+n.toLowerCase()+' app\u2019s data is tagged with <b>destination port '+port+'</b>, so Transport B hands it only to the '+sn.toLowerCase()+'.'}});
const CFG={topic:'Transport Layer · Need & Issues',title:'Transport Layer — Need and Issues',sub:'Global delivery network · many applications, one network, every byte in the right place',icon:'🚚',a:['#0e7490','#7c3aed','#be185d'],
 idea:'The <b>transport layer</b> gives <b>end-to-end</b> communication between <i>processes</i>, not just hosts. On top of a best-effort network it provides <b>multiplexing</b> (ports), <b>segmentation</b>, <b>reliability</b>, <b>flow control</b> and <b>congestion control</b>. <b>Click any application</b> to light up its stream.',
 tblTitle:'Transport state',legend:[[PK,'Game'],[C,'Video'],[G,'Chat'],[A,'Browser'],[X,'Lost / overflow']],tele:{SEGMENTS:'—'},flows:FL,
 nodes:[...apps.map(([k,i,n,sn,c,port,y])=>nd('a'+k,70,y,i,n,'src '+(40000+port-4999),c)),nd('TA',250,234,'🚚','Transport A','mux / demux',V),nd('NET',400,234,'☁️','Network (IP)','host-to-host only','#60a5fa'),nd('TB',550,234,'🚚','Transport B','mux / demux',V),
  ...apps.map(([k,i,n,sn,c,port,y])=>nd('b'+k,730,y,i,sn,'port '+port,c))],
 links:[...apps.map(a=>['a'+a[0],'TA']),['TA','NET'],['NET','TB'],...apps.map(a=>['TB','b'+a[0]])],
 sc:{
 mux:{name:'Multiplexing & ports',tbl:{GAME:'—',VIDEO:'—',CHAT:'—',BROWSER:'—'},init:{},intro:'Four apps share one machine. Press <b>Play</b>, or click an application to light up its stream.',steps:[
  {title:'One machine, four applications',text:'Game, video, chat and browser all send at the same time over <b>one</b> network connection. IP can only deliver to a <i>machine</i>. Who delivers to the right <i>program</i>? The transport layer.',pulse:'TA',pc:V},
  {title:'Multiplexing',text:'Transport A collects data from every application on this host and merges it onto the network.',packets:apps.map(([k,,,,c],j)=>({p:['a'+k,'TA'],l:lbl[k],c,d:j*150})),set:{TA:['multiplexing',V]}},
  {title:'Tag with port numbers',text:'Each segment gets a <b>source and destination port</b>. Ports identify the application, like a flat number inside a building whose street address is the IP.',pulse:'TA',pc:A,tbl:{GAME:'→ port 5000',VIDEO:'→ port 5001',CHAT:'→ port 5002',BROWSER:'→ port 5003'},set:{TA:['ports added',A]},tele:{SEGMENTS:'4'}},
  {title:'Network delivers to the host',text:'The network layer sees only host addresses. It gets all four segments to machine B, but cannot tell which program should receive which.',packets:apps.map(([k,,,,c,port],j)=>({p:['TA','NET','TB'],l:'seg :'+port,c,d:j*150})),set:{NET:['IP: host only',M],TB:['4 segments',V]}},
  {title:'Demultiplexing',text:'Transport B reads each destination port and hands the segment to the matching application.',packets:apps.map(([k,,,,c,port],j)=>({p:['TB','b'+k],l:'→ '+port,c,d:j*150})),set:{TB:['demultiplexing',V],bG:['GAME ✓',G],bV:['VIDEO ✓',G],bC:['CHAT ✓',G],bW:['WEB ✓',G]},end:'ok'}]},
 seg:{name:'Issue · segmentation & reassembly',tbl:{Message:'—',Segments:'—','Arrival order':'—'},init:{},intro:'A large message must be cut up and rebuilt. Press <b>Play</b>.',steps:[
  {title:'A large message',text:'The browser wants to send a 3000-byte page. A network packet carries only a limited payload, so the message must be broken up.',pulse:'aW',pc:A,tbl:{Message:'3000 B'}},
  hop('aW','TA','MESSAGE 3000 B',A,'Handed to transport','The application writes the whole message to its socket.',{set:{TA:['got 3000 B',A]}}),
  {title:'Segmentation',text:'Transport splits it into three segments and gives each a <b>sequence number</b> so they can be put back in order.',pulse:'TA',pc:V,tbl:{Segments:'S1 (0) · S2 (1000) · S3 (2000)'},set:{TA:['3 segments',V]},tele:{SEGMENTS:'3'}},
  {title:'Segments take different paths',text:'The network may reorder segments. Here S2 takes a slower route and arrives last.',packets:[{p:['TA','NET','TB'],l:'S1 · seq 0',c:A},{p:['TA','NET','TB'],l:'S3 · seq 2000',c:A,d:350},{p:['TA','NET','TB'],l:'S2 · seq 1000',c:A,d:1100}],tbl:{'Arrival order':'S1, S3, S2'},hl:'Arrival order',set:{TB:['out of order',X]}},
  {title:'Reassembly',text:'Transport B uses the sequence numbers to rebuild the original message before giving it to the application.',pulse:'TB',pc:G,packets:[{p:['TB','bW'],l:'MESSAGE 3000 B',c:G}],set:{TB:['reassembled ✓',G],bW:['got 3000 B ✓',G]},end:'ok'}]},
 rel:{name:'Issue · loss and reliability',tbl:{'Segment sent':'—','ACK received':'—'},init:{},intro:'IP may lose packets. Press <b>Play</b> to see transport repair it end to end.',steps:[
  {title:'The network is unreliable',text:'IP is <b>best effort</b>: packets can be lost, duplicated or corrupted. Applications want complete data, so transport adds <b>end-to-end reliability</b>.',pulse:'NET',pc:X,set:{NET:['best effort',M]}},
  hop('TA','TB','SEG 1',C,'Segment 1 arrives','Delivered normally.',{via:'NET',tbl:{'Segment sent':'#1'},set:{TB:['got #1',G]}}),
  hop('TA','TB','SEG 2',X,'Segment 2 is lost','The network drops it and nobody is told.',{via:'NET',bounce:'lose',tbl:{'Segment sent':'#2 (lost)'},set:{NET:['dropped #2',X]}}),
  {title:'Timeout',text:'No ACK arrives before the <b>retransmission timer</b> expires, so the sender knows something went wrong.',pulse:'TA',pc:X,set:{TA:['timeout ⏱',X]}},
  hop('TA','TB','SEG 2 (retry)',A,'Retransmit','Transport A sends segment 2 again.',{via:'NET',tbl:{'Segment sent':'#2 (retry)'},set:{TB:['got #1 #2',G],TA:['retransmitted',A]}}),
  hop('TB','TA','ACK 3',G,'Acknowledged','The receiver confirms everything up to #2. Reliability is built <b>end to end</b>, on top of an unreliable network.',{via:'NET',tbl:{'ACK received':'ACK 3'},set:{TA:['all acked ✓',G]},end:'ok'})]},
 flow:{name:'Issue · flow control',tbl:{'Receiver buffer':'0 / 4','Sender rate':'fast'},init:{},intro:'A fast sender can swamp a slow receiver. Press <b>Play</b>.',steps:[
  {title:'Fast sender, slow receiver',text:'A fast server can overwhelm a slow receiver. <b>Flow control</b> stops the sender from sending more than the receiver can hold.',pulse:'TA',pc:C,set:{TA:['sending fast',C],TB:['buffer 0/4',G]}},
  {title:'Buffer fills up',text:'Three segments arrive faster than the application reads them.',packets:[1,2,3].map((n,j)=>({p:['TA','NET','TB'],l:'SEG '+n,c:C,d:j*200})),tbl:{'Receiver buffer':'3 / 4'},set:{TB:['buffer 3/4',A]}},
  {title:'Buffer full',text:'One more segment fills the last slot. The sender has no idea.',packets:[{p:['TA','NET','TB'],l:'SEG 4',c:C}],tbl:{'Receiver buffer':'4 / 4 FULL'},hl:'Receiver buffer',set:{TB:['buffer FULL',X]}},
  hop('TA','TB','SEG 5',X,'Overflow: segment dropped','There is no room left, so the segment is thrown away.',{via:'NET',bounce:'lose',set:{NET:['dropped #5',X]}}),
  hop('TB','TA','WINDOW = 1',A,'Receiver advertises a window','The receiver says how much room it has. The sender must not exceed it.',{via:'NET',tbl:{'Receiver buffer':'3 / 4','Sender rate':'slowed'},set:{TA:['slows down',A],TB:['app read data',G]}}),
  hop('TA','TB','SEG 5',G,'Sender obeys the window','Only one segment is sent. Nothing is lost this time.',{via:'NET',tbl:{'Receiver buffer':'4 / 4'},set:{TB:['buffer 4/4',G],TA:['rate matched ✓',G]},end:'ok'})]}},
 world:()=>{const lanes=[PK,C,G,A].map((c,i)=>`<line class="dl" x1="170" x2="630" y1="${210+i*12}" y2="${210+i*12}" stroke="${c}" stroke-width="2" opacity=".4"/>`).join('');
  const box=(x,t)=>`<rect x="${x}" y="52" width="104" height="418" rx="18" fill="rgba(34,211,238,.035)" stroke="rgba(34,211,238,.18)"/><text x="${x+52}" y="46" class="wm" style="font-size:9.5px;letter-spacing:.1em" fill="#22d3ee">${t}</text>`;
  return `<rect x="160" y="196" width="480" height="60" rx="16" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>${lanes}${box(18,'HOST A · SENDER')}${box(678,'HOST B · RECEIVER')}<text x="400" y="30" class="wm big" fill="#22d3ee">GLOBAL DELIVERY NETWORK</text><text x="400" y="446" class="wm" fill="#8e9bb8" style="font-size:9.5px">FOUR LANES · ONE ROAD · PORTS DECIDE WHO GETS WHAT</text>`}};

const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),svg=$('#svg');
let LK={},SC,idx=0,busy=false,playing=false,speed=1,tok=0,pos={},count=0,TELE={},TBL={},HL='',layer;
const sleep=ms=>new Promise(r=>setTimeout(r,ms/speed));
const el=(t,a={},p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const mv=(g,p,q,ms,t)=>new Promise(res=>{const s=performance.now(),d=ms/speed;(function f(n){if(t!==tok)return res();const u=Math.min(1,(n-s)/d),e=ease(u);g.setAttribute('transform',`translate(${p.x+(q.x-p.x)*e},${p.y+(q.y-p.y)*e})`);u<1?requestAnimationFrame(f):res()})(s)});
async function fly(pts,labels,cols,bounce,t){
  const pick=(v,i)=>Array.isArray(v)?v[Math.min(i,v.length-1)]:v;
  const g=el('g',{},layer),r=el('rect',{y:-11,height:22,rx:11,fill:'#0b1222','stroke-width':1.8},g),tx=el('text',{class:'pl'},g);
  g.setAttribute('transform',`translate(${pts[0].x},${pts[0].y})`);
  const label=(l,c)=>{tx.textContent=l;const w=l.length*6.8+20;r.setAttribute('x',-w/2);r.setAttribute('width',w);r.setAttribute('stroke',c);g.style.filter=`drop-shadow(0 0 7px ${c})`};
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],last=i===pts.length-1;label(pick(labels,i-1),pick(cols,i-1));
    if(last&&bounce==='lose'){const m={x:a.x+(b.x-a.x)*.55,y:a.y+(b.y-a.y)*.55};await mv(g,a,m,750,t);if(t!==tok)return g.remove();label(pick(labels,i-1)+' ✗',X);await sleep(500);return g.remove()}
    if(last&&bounce){const m={x:a.x+(b.x-a.x)*.74,y:a.y+(b.y-a.y)*.74};await mv(g,a,m,750,t);if(t!==tok)return g.remove();label(pick(labels,i-1)+' ✗',X);await sleep(350);await mv(g,m,a,600,t)}
    else await mv(g,a,b,750,t);
    if(t!==tok)return g.remove();
  }
  g.style.transition='opacity .25s';g.style.opacity=0;await sleep(250);g.remove();
}
function pulse(id,c){const n=pos[id],e=el('circle',{cx:n.x,cy:n.y,r:36,class:'rip',stroke:c||n.c},layer);setTimeout(()=>e.remove(),1200)}
function stat(id,txt,col){const g=$('#n_'+id+' .chip');if(!txt){g.style.opacity=0;return}g.style.opacity=1;const t=g.querySelector('text'),r=g.querySelector('rect'),w=txt.length*6.5+20;t.textContent=txt;t.setAttribute('fill',col);r.setAttribute('x',-w/2);r.setAttribute('width',w);r.setAttribute('stroke',col)}
function lit(a,b,col,dash,txt){const k=LK[a+'|'+b];if(!k)return;const s=k.l.style;s.stroke=col||'';s.strokeWidth=col?7:'';s.strokeDasharray=dash?'3 9':'';s.filter=col?`drop-shadow(0 0 7px ${col})`:'';if(k.r)k.r.setAttribute('stroke',col||'#33405f');if(txt!=null&&k.t)k.t.textContent=txt}
function build(){
  svg.innerHTML='<defs><pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#fbbf24"/><rect x="6" width="6" height="12" fill="#1a1a1a"/></pattern></defs>';
  svg.insertAdjacentHTML('beforeend',CFG.world());
  LK={};CFG.links.forEach(([a,b])=>{LK[a+'|'+b]=LK[b+'|'+a]={l:el('line',{x1:pos[a].x,y1:pos[a].y,x2:pos[b].x,y2:pos[b].y,class:'lk'})}});
  CFG.links.forEach(([a,b,w])=>{if(w==null)return;const g=el('g',{transform:`translate(${(pos[a].x+pos[b].x)/2},${(pos[a].y+pos[b].y)/2})`}),ww=String(w).length*7.4+14,k=LK[a+'|'+b];
   k.r=el('rect',{x:-ww/2,y:-10,width:ww,height:20,rx:7,fill:'#0b1222',stroke:'#33405f','stroke-width':1.3},g);k.t=el('text',{class:'lc'},g);k.t.textContent=w});
  CFG.nodes.forEach(n=>{const g=el('g',{id:'n_'+n.id,transform:`translate(${n.x},${n.y})`});
    el('circle',{r:42,class:'halo',stroke:n.c},g);el('circle',{r:32,class:'body',stroke:n.c},g);
    el('text',{class:'em'},g).textContent=n.i;el('text',{class:'nl',y:52},g).textContent=n.l;el('text',{class:'ns',y:65},g).textContent=n.s;
    const c=el('g',{class:'chip',transform:'translate(0,86)'},g);el('rect',{y:-10,height:20,rx:10,fill:'#0b1222','stroke-width':1.4},c);el('text',{class:'ct'},c);if(CFG.flows&&CFG.flows[n.id]){g.style.cursor='pointer';g.addEventListener('click',()=>flow(n.id))}});
  layer=el('g');
}
function flow(id){const f=CFG.flows[id],t=tok;f.path.slice(1).forEach((b,i)=>lit(f.path[i],b,f.color));narr(f.title,f.text);fly(f.path.map(k=>pos[k]),f.label,f.color,false,t);count++;hud();setTimeout(()=>f.path.slice(1).forEach((b,i)=>lit(f.path[i],b,'')),3300/speed)}
function setPh(i){$('#ph').innerHTML=(SC.phases||[]).map((p,k)=>`<span class="${k<i?'dn':k===i?'on':''}">${p}</span>`).join('')}
function hud(){const s=[['STEP',`${idx}/${SC.steps.length}`],['FRAMES',count],...Object.entries(TELE)];$('#hud').innerHTML=s.map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}
function tbl(){$('#tb').innerHTML=Object.entries(TBL).map(([k,v])=>`<div class="row${k===HL?' hl':''}"><span>${k}</span><b>${v}</b></div>`).join('')}
function narr(t,x,cls=''){$('#nt').textContent=t;$('#nx').innerHTML=x;$('#narr').className='card pad narr '+cls}
function btn(){$('#play').textContent=playing?'⏸ Pause':idx>=SC.steps.length?'↻ Replay':'▶ Play'}
function reset(){
  tok++;busy=false;playing=false;idx=0;count=0;TELE={...CFG.tele};TBL={...SC.tbl};HL='';build();
  svg.dataset.gate=SC.gate||'closed';CFG.nodes.forEach(n=>stat(n.id,''));for(const k in SC.init)stat(k,...SC.init[k]);
  $('#tl').innerHTML=SC.steps.map((s,i)=>`<li id="t${i}"><i>${i+1}</i>${s.title}</li>`).join('');
  narr('Ready',SC.intro);hud();tbl();btn();setPh(-1);
}
async function run(s,t){
  const li=$('#t'+idx);li.className='on';narr(s.title,s.text);if(s.ph!=null)setPh(s.ph);
  if(s.lkReset)CFG.links.forEach(([a,b,w])=>lit(a,b,'',0,w));for(const e of s.lk||[])lit(...e);
  if(s.pulse)pulse(s.pulse,s.pc);
  const fl=s.packets||(s.from?[].concat(s.to).map(to=>({p:[s.from,...[].concat(s.via||[]),to],l:s.label,c:s.color,b:s.bounce})):[]);
  if(fl.length){await Promise.all(fl.map(async f=>{if(f.d)await sleep(f.d);await fly(f.p.map(k=>pos[k]),f.l,f.c,f.b,t)}));count+=fl.length}
  else await sleep(1000);
  if(t!==tok)return false;
  for(const k in s.set)stat(k,...s.set[k]);Object.assign(TELE,s.tele||{});Object.assign(TBL,s.tbl||{});HL=s.hl||'';
  if(s.gate)svg.dataset.gate=s.gate;if(s.end)narr(s.title,s.text,s.end);
  li.className='done';await sleep(450);return t===tok;
}
async function next(){if(busy||idx>=SC.steps.length)return;busy=true;const t=tok;if(!await run(SC.steps[idx],t))return;busy=false;idx++;hud();tbl();btn()}
$('#play').onclick=async()=>{if(playing){playing=false;btn();return}if(idx>=SC.steps.length)reset();playing=true;btn();while(playing&&idx<SC.steps.length)await next();if(tok)playing=false;btn()};
$('#step').onclick=()=>{playing=false;btn();next()};$('#rst').onclick=reset;
$('#spd').onchange=e=>speed=+e.target.value;
$('#scn').onchange=e=>{SC=CFG.sc[e.target.value];reset()};
CFG.nodes.forEach(n=>pos[n.id]=n);
['--a1','--a2','--a3'].forEach((v,i)=>document.documentElement.style.setProperty(v,CFG.a[i]));
$('#logo').textContent=CFG.icon;$('#cr').textContent=CFG.topic;$('#h1').textContent=CFG.title;$('#sub').textContent=CFG.sub;$('#idea').innerHTML=CFG.idea;$('#tt').textContent=CFG.tblTitle;
$('#lg').innerHTML=CFG.legend.map(([c,t])=>`<div class="lg"><i style="background:${c}"></i>${t}</div>`).join('');
$('#scn').innerHTML=Object.entries(CFG.sc).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
SC=Object.values(CFG.sc)[0];reset();
</script></body></html>
