 need:{name:'Why a network layer? (addressing + routing)',tbl:{...NT},init:{},intro:'Host A wants to talk to Host B on another network. Press <b>Play</b> to follow one packet across the city.',steps:[

  {title:'Link R2–R4 fails',text:'A cable is cut and the link is <b>down</b>, but R1 does not know yet.',lk:[['R2','R4',X,true,'✗']],set:{R2:['link down',X]},tbl:{'Link R2–R4':'DOWN'},hl:'Link R2–R4'},

  hop('A','B','IP A→B',G,'Delivered via backup','The next packet reaches B over the new route. Good routing adapts to failures.',{via:['R1','R3','R4'],end:'ok',set:{B:['received ✓',G]}})]},

 cong:{name:'Issue · congestion at a router',tbl:{'R1 queue':'0 / 6','Input rate':'normal'},init:{R1:['queue 0/6',G]},intro:'Two hosts share one WAN link through R1. Press <b>Play</b> and watch the queue.',steps:[

 world:()=>{const sk=Array.from({length:38},(_,i)=>{const h=10+Math.abs(Math.sin(i*1.7))*24;return `<rect x="${12+i*20.5}" y="${458-h}" width="15" height="${h}" fill="rgba(45,212,191,.07)"/>`}).join('');

const el=(t,a={},p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};

async function fly(pts,labels,cols,bounce,t){
  const pick=(v,i)=>Array.isArray(v)?v[Math.min(i,v.length-1)]:v;
  const g=el('g',{},layer),r=el('rect',{y:-11,height:22,rx:11,fill:'#0b1222','stroke-width':1.8},g),tx=el('text',{class:'pl'},g);
  g.setAttribute('transform',`translate(${pts[0].x},${pts[0].y})`);
  const label=(l,c)=>{tx.textContent=l;const w=l.length*6.8+20;r.setAttribute('x',-w/2);r.setAttribute('width',w);r.setAttribute('stroke',c);g.style.filter=`drop-shadow(0 0 7px ${c})`};
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],last=i===pts.length-1;label(pick(labels,i-1),pick(cols,i-1));
    if(last&&bounce){const m={x:a.x+(b.x-a.x)*.74,y:a.y+(b.y-a.y)*.74};await mv(g,a,m,750,t);if(t!==tok)return g.remove();label(pick(labels,i-1)+' ✗',X);await sleep(350);await mv(g,m,a,600,t)}

  CFG.nodes.forEach(n=>{const g=el('g',{id:'n_'+n.id,transform:`translate(${n.x},${n.y})`});
    el('circle',{r:42,class:'halo',stroke:n.c},g);el('circle',{r:32,class:'body',stroke:n.c},g);
    el('text',{class:'em'},g).textContent=n.i;el('text',{class:'nl',y:52},g).textContent=n.l;el('text',{class:'ns',y:65},g).textContent=n.s;
    const c=el('g',{class:'chip',transform:'translate(0,86)'},g);el('rect',{y:-10,height:20,rx:10,fill:'#0b1222','stroke-width':1.4},c);el('text',{class:'ct'},c)});
  layer=el('g');
}
function hud(){const s=[['STEP',`${idx}/${SC.steps.length}`],['FRAMES',count],...Object.entries(TELE)];$('#hud').innerHTML=s.map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}
function tbl(){$('#tb').innerHTML=Object.entries(TBL).map(([k,v])=>`<div class="row${k===HL?' hl':''}"><span>${k}</span><b>${v}</b></div>`).join('')}
function narr(t,x,cls=''){$('#nt').textContent=t;$('#nx').innerHTML=x;$('#narr').className='card pad narr '+cls}
function btn(){$('#play').textContent=playing?'⏸ Pause':idx>=SC.steps.length?'↻ Replay':'▶ Play'}
function reset(){
  tok++;busy=false;playing=false;idx=0;count=0;TELE={...CFG.tele};TBL={...SC.tbl};HL='';build();
  svg.dataset.gate=SC.gate||'closed';CFG.nodes.forEach(n=>stat(n.id,''));for(const k in SC.init)stat(k,...SC.init[k]);
  $('#tl').innerHTML=SC.steps.map((s,i)=>`<li id="t${i}"><i>${i+1}</i>${s.title}</li>`).join('');
  narr('Ready',SC.intro);hud();tbl();btn();
}
async function run(s,t){
  const li=$('#t'+idx);li.className='on';narr(s.title,s.text);
  if(s.lkReset)CFG.links.forEach(([a,b,w])=>lit(a,b,'',0,w));for(const e of s.lk||[])lit(...e);
  if(s.pulse)pulse(s.pulse,s.pc);
  if(s.from){const tos=[].concat(s.to);await Promise.all(tos.map(to=>fly([pos[s.from],...[].concat(s.via||[]).map(v=>pos[v]),pos[to]],s.label,s.color,s.bounce,t)));count+=tos.length}
  else await sleep(1000);
  if(t!==tok)return false;
  for(const k in s.set)stat(k,...s.set[k]);Object.assign(TELE,s.tele||{});Object.assign(TBL,s.tbl||{});HL=s.hl||'';
  if(s.gate)svg.dataset.gate=s.gate;if(s.end)narr(s.title,s.text,s.end);
  li.className='done';await sleep(450);return t===tok;
}
async function next(){if(busy||idx>=SC.steps.length)return;busy=true;const t=tok;if(!await run(SC.steps[idx],t))return;busy=false;idx++;hud();tbl();btn()}
$('#play').onclick=async()=>{if(playing){playing=false;btn();return}if(idx>=SC.steps.length)reset();playing=true;btn();while(playing&&idx<SC.steps.length)await next();if(tok)playing=false;btn()};
$('#step').onclick=()=>{playing=false;btn();next()};$('#rst').onclick=reset;
$('#spd').onchange=e=>speed=+e.target.value;
$('#scn').onchange=e=>{SC=CFG.sc[e.target.value];reset()};
CFG.nodes.forEach(n=>pos[n.id]=n);
['--a1','--a2','--a3'].forEach((v,i)=>document.documentElement.style.setProperty(v,CFG.a[i]));
$('#logo').textContent=CFG.icon;$('#cr').textContent=CFG.topic;$('#h1').textContent=CFG.title;$('#sub').textContent=CFG.sub;$('#idea').innerHTML=CFG.idea;$('#tt').textContent=CFG.tblTitle;
$('#lg').innerHTML=CFG.legend.map(([c,t])=>`<div class="lg"><i style="background:${c}"></i>${t}</div>`).join('');
$('#scn').innerHTML=Object.entries(CFG.sc).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
SC=Object.values(CFG.sc)[0];reset();
</script></body></html>
