body{
  background:var(--void);color:var(--foam);font-family:var(--body);font-size:15px;line-height:1.55;
  display:flex;align-items:center;justify-content:center;cursor:none;
}
.wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}

/* ---------- stage (16:9) ---------- */
.stage{
  container-type:inline-size;position:relative;width:100vw;height:100vh;--su:min(1vw,1.7778vh);margin:0;border-radius:0;overflow:hidden;border:0;isolation:isolate;
  background:
    linear-gradient(118deg,transparent 28%,rgba(93,255,176,.08) 44%,rgba(184,255,90,.06) 52%,transparent 68%),
    radial-gradient(60% 50% at 50% 40%,rgba(40,220,130,.16),transparent 70%),
    radial-gradient(90% 90% at 50% 42%,#0a3a27 0%,var(--forest) 52%,var(--void) 100%);
}
.neb{position:absolute;border-radius:50%;filter:blur(16px);z-index:0;will-change:transform}
.neb.a{left:calc(-12 * var(--su));top:calc(-26 * var(--su));width:calc(60 * var(--su));height:calc(60 * var(--su));background:radial-gradient(circle,rgba(40,220,130,.5),transparent 65%);animation:drift 20s ease-in-out infinite alternate}
.neb.b{right:calc(-14 * var(--su));bottom:calc(-30 * var(--su));width:calc(66 * var(--su));height:calc(66 * var(--su));background:radial-gradient(circle,rgba(20,170,150,.42),transparent 66%);animation:drift 26s ease-in-out infinite alternate-reverse}
.neb.c{left:calc(28 * var(--su));bottom:calc(-34 * var(--su));width:calc(50 * var(--su));height:calc(50 * var(--su));background:radial-gradient(circle,rgba(150,240,70,.28),transparent 66%);animation:drift 23s ease-in-out infinite alternate}
.aurora{position:absolute;left:-15%;right:-15%;top:8%;height:28%;z-index:0;filter:blur(18px);opacity:.5;
  background:linear-gradient(100deg,transparent 5%,rgba(93,255,176,.55) 30%,rgba(184,255,90,.35) 55%,transparent 85%);
  transform:rotate(-7deg);animation:sway 8s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(calc(4 * var(--su)),calc(-3 * var(--su))) scale(1.12)}}
@keyframes sway{from{transform:rotate(-7deg) translateX(-5%)}to{transform:rotate(-4deg) translateX(5%)}}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}

.glow{position:absolute;left:50%;top:40%;width:calc(70 * var(--su));height:calc(70 * var(--su));margin:calc(-35 * var(--su)) 0 0 calc(-35 * var(--su));border-radius:50%;z-index:1;
  background:radial-gradient(circle,rgba(93,255,176,.5) 0%,rgba(40,220,130,.16) 34%,transparent 62%);filter:blur(5px)}
.flash{position:absolute;left:50%;top:40%;width:calc(24 * var(--su));height:calc(24 * var(--su));margin:calc(-12 * var(--su)) 0 0 calc(-12 * var(--su));border-radius:50%;z-index:1;
  background:radial-gradient(circle,#fff 0%,rgba(184,255,190,.9) 25%,transparent 68%);opacity:0}
.ring{position:absolute;left:50%;top:40%;width:calc(30 * var(--su));height:calc(30 * var(--su));margin:calc(-15 * var(--su)) 0 0 calc(-15 * var(--su));border-radius:50%;
  border:calc(.25 * var(--su)) solid var(--mint);opacity:0;z-index:1}
.ring.r2{border-color:var(--lime)}

.vanish,.cam{position:absolute;inset:0;display:grid;place-items:center;z-index:2;transform-origin:50% 46%}
.group{display:flex;flex-direction:column;align-items:center;gap:calc(1.1 * var(--su));margin-top:calc(-2 * var(--su))}
.pop{transform-origin:50% 60%}
.bob{transform-origin:50% 70%}
.mascot{position:relative;width:calc(31 * var(--su));aspect-ratio:620/512;background:var(--img) center/contain no-repeat;
  filter:drop-shadow(0 0 calc(2.4 * var(--su)) rgba(93,255,176,.35)) drop-shadow(0 calc(1.2 * var(--su)) calc(1.6 * var(--su)) rgba(0,0,0,.45))}
.shine{position:absolute;inset:0;
  -webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.8) 50%,transparent 62%) 160% 0/260% 100% no-repeat}
.word{display:flex;font-family:var(--display);font-weight:800;font-size:calc(7.4 * var(--su));line-height:1;letter-spacing:-.03em;color:var(--foam);
  text-shadow:0 0 calc(2.4 * var(--su)) rgba(93,255,176,.45)}
.ch{display:inline-block;overflow:hidden;padding:.06em .01em .16em;margin-bottom:-.16em}
.ch>span{display:inline-block}
.ch.cn>span{color:var(--coral);text-shadow:0 0 calc(2 * var(--su)) rgba(251,60,112,.5)}
.ch.sp{width:.28em}
.link{display:flex;align-items:center;width:calc(20 * var(--su));height:calc(1.4 * var(--su))}
.link i{display:block;width:calc(1.1 * var(--su));height:calc(1.1 * var(--su));border-radius:50%;background:var(--mint);box-shadow:0 0 calc(1.4 * var(--su)) rgba(93,255,176,.8)}
.link b{display:block;flex:1;height:calc(.28 * var(--su));border-radius:calc(1 * var(--su));background:linear-gradient(90deg,var(--mint),var(--lime));transform-origin:0 50%}
.hud{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.07);z-index:4}
.hud span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--mint));transform-origin:0 50%;transform:scaleX(0)}

/* ---------- controls + timing ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
button{font:500 14px/1 var(--body);color:var(--void);background:var(--foam);border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
button:hover{background:#fff}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.status{font:400 12px/1 var(--mono);color:var(--mist);letter-spacing:.04em}
.beats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line)}
.beats li{padding:12px 14px 4px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.beats time{font:500 12px/1.6 var(--mono);color:var(--mint);font-variant-numeric:tabular-nums}
.beats strong{font-weight:500}
.beats small{color:var(--mist);font:400 12px/1.5 var(--mono)}
h1{font:800 clamp(22px,3.4vw,30px)/1.1 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}

.fade{position:absolute;inset:0;background:#000;z-index:5;opacity:1;pointer-events:none}
@media (prefers-reduced-motion:reduce){.hud{display:none}.neb,.aurora{animation:none}}
</style>

<main class="wrap">
  <div class="stage" id="stage" role="img" aria-label="Cresco CN intro animation">
    <div class="neb a"></div><div class="neb b"></div><div class="neb c"></div>
    <div class="aurora"></div>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="glow" id="glow"></div>
    <div class="flash" id="flash"></div>
    <div class="ring" id="r1"></div>

    <div class="vanish" id="vanish">
      <div class="cam" id="cam">
        <div class="group">
          <div class="pop" id="pop"><div class="bob" id="bob"><div class="mascot"><div class="shine" id="shine"></div></div></div></div>
          <div class="word" id="word"></div>
          <div class="link"><i id="d1"></i><b id="line"></b><i id="d2"></i></div>
        </div>
      </div>
    </div>
    <div class="fade" id="fade"></div>
  </div>

</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var TOTAL=1800, V=1350;
  var anims=[], timer=null, raf=0, t0=0;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stage=$("stage"), cv=$("stars"), ctx=cv.getContext("2d");
  var word=$("word");

  var text="Cresco CN", letters=[];
  text.split("").forEach(function(c,i){
    var w=document.createElement("span");
    w.className="ch"+(i>=7?" cn":"")+(c===" "?" sp":"");
    var s=document.createElement("span");
    s.textContent=c===" "?" ":c;
    w.appendChild(s); word.appendChild(w);
    if(c!==" ") letters.push(s);
  });

  /* ---- starfield ---- */
  var W=0,H=0,dpr=1,stars=[];
  var COLORS=["255,255,255","190,255,225","184,255,120","120,255,200"];
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=stage.clientWidth; H=stage.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mk(far){
    return {x:(Math.random()*2-1),y:(Math.random()*2-1),z:far?Math.random():1,c:COLORS[(Math.random()*COLORS.length)|0],tw:Math.random()*6.28};
  }
  function initStars(){ stars=[]; for(var i=0;i<190;i++) stars.push(mk(true)); initNodes(); }
  /* ---- network layer: orbits + linked nodes + data pulses ---- */
  var nodes=[];
  function initNodes(){ nodes=[]; for(var i=0;i<64;i++) nodes.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.05,vy:(Math.random()-.5)*.05,r:.8+Math.random()*1.7,hub:i%9===0}); }
  function drawNet(t,dt,cx,cy){
    var nf=reduce?1:Math.max(0,Math.min(1,(t-60)/450)); if(nf<=0) return;
    var o,i,j,p,q;
    ctx.save(); ctx.translate(cx,cy);
    for(o=0;o<3;o++){
      var rx=W*(.22+.1*o), ry=rx*.32, ang=t*.0013*(1+o*.4)+o*2;
      ctx.save(); ctx.rotate(-.35+o*.28+t*.00012*(o%2?1:-1));
      ctx.strokeStyle="rgba(93,255,176,"+(.1*nf).toFixed(3)+")"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,6.283); ctx.stroke();
      ctx.fillStyle="rgba(184,255,90,"+(.85*nf).toFixed(3)+")";
      ctx.beginPath(); ctx.arc(Math.cos(ang)*rx,Math.sin(ang)*ry,2.2,0,6.283); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    for(i=0;i<nodes.length;i++){ p=nodes[i];
      p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000;
      if(p.x<0)p.x+=1; if(p.x>1)p.x-=1; if(p.y<0)p.y+=1; if(p.y>1)p.y-=1;
      p.sx=p.x*W; p.sy=p.y*H; }
    var maxD=W*.16, m2=maxD*maxD;
    for(i=0;i<nodes.length;i++){ p=nodes[i];
      for(j=i+1;j<nodes.length;j++){ q=nodes[j];
        var dx=p.sx-q.sx, dy=p.sy-q.sy, d2=dx*dx+dy*dy;
        if(d2<m2){
          var k=1-d2/m2, mx=(p.sx+q.sx)/2-cx, my=(q.sy+p.sy)/2-cy;
          var cf=.45+.55*Math.min(1,Math.sqrt(mx*mx+my*my)/(W*.3));
          var al=k*.5*nf*cf;
          ctx.strokeStyle="rgba(93,255,176,"+al.toFixed(3)+")"; ctx.lineWidth=.5+k*.7;
          ctx.beginPath(); ctx.moveTo(p.sx,p.sy); ctx.lineTo(q.sx,q.sy); ctx.stroke();
          if((i+j)%4===0){ var ph=((t*.0011)+(i*.37+j*.61))%1;
            ctx.fillStyle="rgba(184,255,90,"+Math.min(1,al*2.2).toFixed(3)+")";
            ctx.beginPath(); ctx.arc(p.sx+(q.sx-p.sx)*ph,p.sy+(q.sy-p.sy)*ph,1.1+k*1.3,0,6.283); ctx.fill(); }
        } } }
    for(i=0;i<nodes.length;i++){ p=nodes[i];
      ctx.fillStyle="rgba(190,255,225,"+(.85*nf).toFixed(3)+")";
      ctx.beginPath(); ctx.arc(p.sx,p.sy,p.r*(p.hub?1.7:1),0,6.283); ctx.fill();
      if(p.hub){ ctx.strokeStyle="rgba(93,255,176,"+(.35*nf).toFixed(3)+")"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(p.sx,p.sy,p.r*4,0,6.283); ctx.stroke(); } }
  }
  function speedAt(t){
    var s=0.22+9*Math.exp(-t/230);
    if(t>V){ var u=(t-V)/450; s+=16*u*u; }
    var r=Math.min(1,t/300); r=r*r*(3-2*r);   /* smooth start */
    return s*(.3+.7*r);
  }
  var last=0;
  function frame(now){
    if(!t0) t0=now;
    var t=now-t0, dt=Math.min(now-(last||now),50); last=now;
    var sp=reduce?0.2:speedAt(t);
    ctx.clearRect(0,0,W,H);
    var cx=W/2, cy=H*0.42, sc=W*0.5;
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var dz=sp*dt*0.00055;
      var pz=s.z+dz*(1+sp*0.55);
      s.z-=dz;
      if(s.z<=0.03){ stars[i]=s=mk(false); continue; }
      var x=cx+s.x/s.z*sc*0.35, y=cy+s.y/s.z*sc*0.35*0.8;
      if(x<-20||x>W+20||y<-20||y>H+20){ stars[i]=mk(false); continue; }
      var px=cx+s.x/pz*sc*0.35, py=cy+s.y/pz*sc*0.35*0.8;
      var a=Math.min(1,(1-s.z)*1.5+.1);
      s.tw+=dt*0.004; a*=0.75+0.25*Math.sin(s.tw);
      var r=(1-s.z)*1.7+.3;
      ctx.strokeStyle="rgba("+s.c+","+a.toFixed(3)+")"; ctx.lineWidth=r; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
      if(sp<1.2){ ctx.fillStyle="rgba("+s.c+","+a.toFixed(3)+")"; ctx.beginPath(); ctx.arc(x,y,r*.6,0,6.283); ctx.fill(); }
    }
    drawNet(t,dt,cx,cy);
    if(t<TOTAL+50) raf=requestAnimationFrame(frame); else raf=0;
  }

  function a(el,kf,opt){
    opt=opt||{}; opt.fill="both";
    var x=el.animate(kf,opt); anims.push(x); return x;
  }
  var BACK="cubic-bezier(.34,1.56,.64,1)";
  var OUT="cubic-bezier(.16,1,.3,1)";

  function clear(){
    anims.forEach(function(x){x.cancel()}); anims=[];
    clearTimeout(timer); cancelAnimationFrame(raf);
  }

  function play(){
    clear();
    resize(); initStars(); t0=0; last=0;
    raf=requestAnimationFrame(frame);
    if(reduce){ $("fade").style.opacity=0; return; }

    a($("glow"),[{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1,offset:.3},{transform:"scale(1.08)",opacity:.9,offset:.75},{transform:"scale(.2)",opacity:0}],
      {duration:TOTAL,easing:"ease-out"});
    a($("flash"),[{transform:"scale(.2)",opacity:0},{transform:"scale(1.4)",opacity:1,offset:.25},{transform:"scale(3.2)",opacity:0}],
      {duration:450,delay:30,easing:"ease-out"});

    a($("pop"),[
      {transform:"scale(.04) rotate(-12deg)",opacity:0,filter:"blur(10px)",easing:"cubic-bezier(.2,.7,.2,1)"},
      {transform:"scale(1.12) rotate(2deg)",opacity:1,filter:"blur(0px)",offset:.6,easing:"ease-in-out"},
      {transform:"scale(1) rotate(0deg)",opacity:1,filter:"blur(0px)"}
    ],{duration:550,delay:80});

    a($("bob"),[
      {transform:"translateY(0) rotate(-1deg) scale(1)"},
      {transform:"translateY(-1%) rotate(1deg) scale(1.02)"}
    ],{duration:420,delay:600,direction:"alternate",iterations:3,easing:"ease-in-out"});

    a($("shine"),[{backgroundPosition:"160% 0"},{backgroundPosition:"-60% 0"}],{duration:500,delay:550,easing:"ease-in-out"});

    ["r1","r2"].forEach(function(id,i){
      a($(id),[{transform:"scale(.15)",opacity:.85},{transform:"scale(2.4)",opacity:0}],
        {duration:750,delay:150+i*110,easing:"cubic-bezier(.2,.6,.3,1)"});
    });

    a($("cam"),[{transform:"scale(.92)"},{transform:"scale(1.06)"}],{duration:V,easing:"cubic-bezier(.2,.6,.3,1)"});

    letters.forEach(function(s,i){
      a(s,[{transform:"translateY(115%) rotate(8deg)"},{transform:"translateY(0) rotate(0deg)"}],
        {duration:380,delay:400+i*30,easing:BACK});
    });

    a($("line"),[{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:330,delay:700,easing:OUT});
    [$("d1"),$("d2")].forEach(function(d,i){
      a(d,[{transform:"scale(0)"},{transform:"scale(1)"}],{duration:280,delay:680+i*200,easing:BACK});
    });

    a($("vanish"),[
      {transform:"scale(1)",opacity:1,filter:"blur(0px)"},
      {transform:"scale(1.08)",opacity:0,filter:"blur(6px)"}
    ],{duration:TOTAL-V,delay:V,easing:"ease-in"});

    /* smooth fade-in from black at start, fade to black at end */
    a($("fade"),[
      {opacity:1,offset:0,easing:"ease-out"},
      {opacity:0,offset:380/TOTAL},
      {opacity:0,offset:V/TOTAL,easing:"ease-in"},
      {opacity:1,offset:1}
    ],{duration:TOTAL});

  }

  window.addEventListener("resize",resize);
  play();
  function fs(){
    var d=document,e=d.documentElement;
    try{
      if(d.fullscreenElement){if(d.exitFullscreen)d.exitFullscreen().catch(function(){});}
      else if(e.requestFullscreen){e.requestFullscreen().catch(function(){});}
    }catch(err){}
  }
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(function(){})}}catch(err){}
  ['click','pointerdown','keydown'].forEach(function(evt){
    window.addEventListener(evt,function(){
      if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen().catch(function(){});
      }
    },{once:true,capture:true});
  });
  document.addEventListener("dblclick",fs);
  document.addEventListener("keydown",function(e){if(e.key==="f"||e.key==="F")fs()});
})();
</script>

</body></html>
